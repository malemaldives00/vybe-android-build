
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Select VYBE project ZIP
        shell: bash
        run: |
          set -euo pipefail

          for zipfile in \
            "VYBE_CP_Friend_Click_Back_Repaired.zip" \
            "VYBE_Android_Project_Source_BackButton_Checked.zip" \
            "VYBE_Android_AudioRoom_Fix_Source.zip" \
            "VYBE_Android_Project.zip"
          do
            if [ ! -f "$zipfile" ]; then
              continue
            fi

            rm -rf /tmp/vybe-check
            mkdir -p /tmp/vybe-check
            unzip -q "$zipfile" -d /tmp/vybe-check

            if find /tmp/vybe-check -name settings.gradle -o -name settings.gradle.kts | grep -q . &&
               find /tmp/vybe-check -path '*/app/src/main/AndroidManifest.xml' | grep -q .; then
              echo "Selected ZIP: $zipfile"
              echo "PROJECT_DIR=$(find /tmp/vybe-check -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)" >> "$GITHUB_ENV"
              break
            fi
          done

          if [ -z "${PROJECT_DIR:-}" ] && [ ! -f "$GITHUB_ENV" ]; then
            echo "No valid Android project ZIP found."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
