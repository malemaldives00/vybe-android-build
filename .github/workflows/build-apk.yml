
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract and merge VYBE
        shell: bash
        run: |
          set -euo pipefail

          AUTH_ZIP="VYBE_Login_Signup_Firebase_Configured.zip"
          ICON_ZIP="VYBE_CP_Friend_Click_Back_Repaired_with_MY_EXACT_Icon.zip"

          test -f "$AUTH_ZIP" || {
            echo "ERROR: Missing $AUTH_ZIP"
            exit 1
          }

          test -f "$ICON_ZIP" || {
            echo "ERROR: Missing $ICON_ZIP"
            exit 1
          }

          mkdir auth_src icon_src
          unzip -q "$AUTH_ZIP" -d auth_src
          unzip -q "$ICON_ZIP" -d icon_src

          find_project() {
            local root="$1"
            while IFS= read -r -d '' f; do
              local d
              d="$(dirname "$f")"
              if [ -f "$d/app/build.gradle" ] || \
                 [ -f "$d/app/build.gradle.kts" ]; then
                echo "$d"
                return 0
              fi
            done < <(
              find "$root" -type f \
                \( -name settings.gradle \
                -o -name settings.gradle.kts \) -print0
            )
            return 1
          }

          AUTH_DIR="$(find_project auth_src)" || {
            echo "ERROR: Android project not found in Login/Firebase ZIP"
            exit 1
          }

          ICON_DIR="$(find_project icon_src)" || {
            echo "ERROR: Android project not found in Icon ZIP"
            exit 1
          }

          echo "Using app source: $AUTH_DIR"
          echo "Using icon source: $ICON_DIR"

          AUTH_RES="$AUTH_DIR/app/src/main/res"
          ICON_RES="$ICON_DIR/app/src/main/res"

          test -d "$ICON_RES" || {
            echo "ERROR: Icon resources not found"
            exit 1
          }

          # Copy launcher icon resources without replacing app screens.
          while IFS= read -r -d '' f; do
            rel="${f#"$ICON_RES"/}"
            case "$rel" in
              mipmap*/ic_launcher*|drawable*/ic_launcher*)
                mkdir -p "$AUTH_RES/$(dirname "$rel")"
                cp "$f" "$AUTH_RES/$rel"
                ;;
            esac
          done < <(find "$ICON_RES" -type f -print0)

          # Use the standard launcher icon resource name.
          MANIFEST="$AUTH_DIR/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST" || {
            echo "ERROR: AndroidManifest.xml missing"
            exit 1
          }

          if ! grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"; then
            sed -i 's/<application/<application android:icon="@mipmap\/ic_launcher"/' "$MANIFEST"
          fi

          echo "PROJECT_DIR=$AUTH_DIR" >> "$GITHUB_ENV"

      - name: Configure Firebase
        shell: bash
        run: |
          set -euo pipefail

          FIREBASE_JSON=""

          for f in google-services.json "google-services (1).json"; do
            if [ -f "$f" ]; then
              FIREBASE_JSON="$f"
              break
            fi
          done

          if [ -z "$FIREBASE_JSON" ]; then
            echo "ERROR: Firebase configuration JSON is missing"
            exit 1
          fi

          cp "$FIREBASE_JSON" "$PROJECT_DIR/app/google-services.json"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
