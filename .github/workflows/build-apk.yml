name: Build VYBE Firebase APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "*.zip"
      - "google-services.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract VYBE project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=""
          for file in \
            "VYBE_Login_Signup_FIXED (1).zip" \
            "VYBE_Login_Signup_FIXED.zip" \
            "VYBE_Login_Signup_Firebase_Configured (1).zip" \
            "VYBE_Login_Signup_Firebase_Configured.zip" \
            "VYBE_CP_Friend_Click_Back_Repaired.zip"
          do
            if [ -f "$file" ]; then
              ARCHIVE="$file"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: VYBE ZIP not found. Repository files:"
            ls -la
            exit 1
          fi

          echo "Using ZIP: $ARCHIVE"
          mkdir -p "$RUNNER_TEMP/vybe-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/vybe-source"

          SETTINGS="$(find "$RUNNER_TEMP/vybe-source" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          test -n "$SETTINGS" || {
            echo "ERROR: Gradle settings file not found"
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ -f "$GITHUB_WORKSPACE/google-services.json" ]; then
            mkdir -p "$PROJECT_DIR/app"
            cp "$GITHUB_WORKSPACE/google-services.json" \
              "$PROJECT_DIR/app/google-services.json"
          fi

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: google-services.json not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-Firebase-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
