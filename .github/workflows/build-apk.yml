
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "**/*.zip"
      - "app/**"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          if { [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; } &&
             [ -f "$ROOT/app/src/main/AndroidManifest.xml" ]; then
            PROJECT="$ROOT"
          else
            mkdir -p "$ROOT/source"
            FOUND=""

            while IFS= read -r -d '' ZIP; do
              if unzip -Z1 "$ZIP" |
                   grep -Eq '(^|/)settings\.gradle(\.kts)?$' &&
                 unzip -Z1 "$ZIP" |
                   grep -Eq '(^|/)app/src/main/AndroidManifest\.xml$'; then
                FOUND="$ZIP"
                break
              fi
            done < <(
              find "$ROOT" -maxdepth 3 -type f \
                -iname '*.zip' \
                -not -path "$ROOT/source/*" \
                -print0
            )

            if [ -z "$FOUND" ]; then
              echo "::error::No Android project ZIP found."
              find "$ROOT" -maxdepth 4 -type f | head -200
              exit 1
            fi

            echo "Extracting: $FOUND"
            unzip -q "$FOUND" -d "$ROOT/source"

            while IFS= read -r -d '' FILE; do
              DIR="$(dirname "$FILE")"
              if [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
                PROJECT="$DIR"
                break
              fi
            done < <(
              find "$ROOT/source" -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print0
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Could not locate a complete Android project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -name '*debug*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/output/VYBE-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-debug-APK
          path: output/VYBE-debug.apk
          if-no-files-found: error
          retention-days: 7
