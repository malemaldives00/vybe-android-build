
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - 'vybe_logo.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          ZIP_FILE=""

          for f in ./*.zip; do
            [ -f "$f" ] || continue
            if unzip -Z1 "$f" | grep -Eq '(^|/)settings\.gradle(\.kts)?$' &&
               unzip -Z1 "$f" | grep -Eq '(^|/)app/src/main/AndroidManifest\.xml$'; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP containing an Android Gradle project was found."
            echo "The ZIP must include settings.gradle and app/src/main/AndroidManifest.xml."
            ls -lah
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d source

          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Build completed but APK was not found."
            exit 1
          fi
          cp "$APK" output/VYBE-debug.apk
          ls -lh output/VYBE-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vybe-debug-apk
          path: output/VYBE-debug.apk
          if-no-files-found: error
