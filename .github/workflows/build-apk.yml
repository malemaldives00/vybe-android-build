
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'vybe_logo.png'
      - 'VYBE_CP_Friend_Click_Back_Repaired.zip'
      - 'VYBE_Family_Create_Join_Explore_Source_Checked.zip'
      - 'VYBE_Android_Project_Source_BackButton_Checked.zip'
      - 'VYBE_Android_AudioRoom_Fix_Source.zip'
      - 'VYBE_Android_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f vybe_logo.png || {
            echo "ERROR: Upload vybe_logo.png to repository root."
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source

          ZIP_FILE=""

          for candidate in \
            VYBE_CP_Friend_Click_Back_Repaired.zip \
            VYBE_Family_Create_Join_Explore_Source_Checked.zip \
            VYBE_Android_Project_Source_BackButton_Checked.zip \
            VYBE_Android_AudioRoom_Fix_Source.zip \
            VYBE_Android_Source.zip
          do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No supported source ZIP found."
            ls -la
            exit 1
          fi

          echo "Selected source: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/settings.gradle}"
            candidate="${candidate%/settings.gradle.kts}"

            if [ -f "$candidate/settings.gradle" ] || \
               [ -f "$candidate/settings.gradle.kts" ]; then
              if [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
                PROJECT_DIR="$candidate"
                break
              fi
            fi
          done < <(
            find source -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            find source -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Add original VYBE logo as launcher icon
        shell: bash
        run: |
          set -euo pipefail

          export RES="$PROJECT_DIR/app/src/main/res"
          export MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          python3 -m pip install --quiet Pillow

          python3 <<'PY'
          import os
          from PIL import Image, ImageOps

          res = os.environ["RES"]
          logo_path = "vybe_logo.png"

          logo = Image.open(logo_path).convert("RGBA")

          # Fit the complete logo into a square canvas.
          # Keep the logo's original colors and background.
          side = max(logo.width, logo.height)
          canvas = Image.new("RGBA", (side, side), (0, 0, 0, 255))
          logo.thumbnail((side, side), Image.Resampling.LANCZOS)
          canvas.alpha_composite(
              logo,
              ((side - logo.width) // 2, (side - logo.height) // 2)
          )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              out_dir = os.path.join(res, folder)
              os.makedirs(out_dir, exist_ok=True)
              icon = canvas.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              icon.save(os.path.join(out_dir, "ic_launcher.png"))

          print("Generated launcher icons from vybe_logo.png")
          PY

          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = os.environ["MANIFEST"]
          android = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("ERROR: <application> missing in manifest")

          app.set(android + "icon", "@mipmap/ic_launcher")
          app.set(android + "roundIcon", "@mipmap/ic_launcher")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Manifest updated to use VYBE launcher icon")
          PY

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vybe-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
