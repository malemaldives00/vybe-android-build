
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'VYBE_Login_Signup_FIXED.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract VYBE Login Signup project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="VYBE_Login_Signup_FIXED.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: ZIP file not found: $ARCHIVE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/vybe-source"

          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/vybe-source"

          SETTINGS="$(find "$RUNNER_TEMP/vybe-source" \
            -name settings.gradle \
            -type f -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-Login-Signup-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
