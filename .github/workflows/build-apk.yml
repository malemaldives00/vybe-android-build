
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VYBE_Android_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -VYBE_Android_Source.zip
          test -f source/VYBE_Android/settings.gradle

      - name: Build APK
        working-directory: source/VYBE_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vybe-debug-apk
          path: source/VYBE_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
