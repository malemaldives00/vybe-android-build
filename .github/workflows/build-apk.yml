name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VYBE_Android_AudioRoom_Fix_Source.zip'
      - 'VYBE_Android_Source.zip'
      - 'VYBE_Android_Project_Source_BackButton_Checked.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source

          if [ -f VYBE_Android_Project_Source_BackButton_Checked.zip ]; then
            ZIP_FILE="VYBE_Android_Project_Source_BackButton_Checked.zip"
          elif [ -f VYBE_Android_AudioRoom_Fix_Source.zip ]; then
            ZIP_FILE="VYBE_Android_AudioRoom_Fix_Source.zip"
          elif [ -f VYBE_Android_Source.zip ]; then
            ZIP_FILE="VYBE_Android_Source.zip"
          else
            echo "ERROR: Source ZIP file not found."
            ls -la
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

          if [ -f source/settings.gradle ] || [ -f source/settings.gradle.kts ]; then
            PROJECT_DIR="source"
          elif [ -f source/VYBE_Android/settings.gradle ] || [ -f source/VYBE_Android/settings.gradle.kts ]; then
            PROJECT_DIR="source/VYBE_Android"
          else
            echo "ERROR: Gradle settings file not found."
            find source -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vybe-debug-apk
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            source/VYBE_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
