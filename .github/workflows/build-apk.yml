
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract VYBE project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="VYBE_AUTH_PREMIUM_DESIGN_SOURCE_WITH_APP_ICON.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=""

          while IFS= read -r -d '' settings; do
            candidate="$(dirname "$settings")"

            if [ -f "$candidate/app/build.gradle" ] || \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Configure Firebase
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$PROJECT_DIR/app"
          FIREBASE_FILE="$GITHUB_WORKSPACE/google-services.json"

          if [ -f "$FIREBASE_FILE" ]; then
            cp "$FIREBASE_FILE" "$APP_DIR/google-services.json"
            echo "Firebase configuration copied."
          else
            echo "ERROR: google-services.json is missing."
            echo "Add your Firebase Android configuration to the repository root."
            exit 1
          fi

      - name: Check app files and launcher icon
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$PROJECT_DIR/app"

          if [ ! -f "$APP_DIR/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if [ ! -f "$APP_DIR/src/main/assets/index.html" ]; then
            echo "ERROR: app/src/main/assets/index.html not found."
            exit 1
          fi

          if ! find "$APP_DIR/src/main/res" -type f \
            \( -name "ic_launcher.png" \
            -o -name "ic_launcher.xml" \
            -o -name "ic_launcher.webp" \) \
            | grep -q .; then
            echo "ERROR: Launcher icon not found."
            exit 1
          fi

          echo "Required app files found."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build VYBE APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload VYBE APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
