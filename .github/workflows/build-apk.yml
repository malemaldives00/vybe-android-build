
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "VYBE_AUTH_PREMIUM_DESIGN_SOURCE_WITH_APP_ICON.zip"
      - "google-services.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract VYBE source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/VYBE_AUTH_PREMIUM_DESIGN_SOURCE_WITH_APP_ICON.zip"
          SOURCE_DIR="$RUNNER_TEMP/vybe-source"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Source ZIP not found."
            exit 1
          fi

          mkdir -p "$SOURCE_DIR"
          unzip -q "$ARCHIVE" -d "$SOURCE_DIR"

          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            candidate="$(dirname "$file")"
            if [ -f "$candidate/app/build.gradle" ] &&
               [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$SOURCE_DIR" -name settings.gradle -print0)

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r -d '' file; do
              candidate="$(dirname "$file")"
              if [ -f "$candidate/app/build.gradle.kts" ] &&
                 [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find "$SOURCE_DIR" -name settings.gradle.kts -print0)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found in ZIP."
            find "$SOURCE_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          FIREBASE_FILE="$PROJECT_DIR/app/google-services.json"
          mkdir -p "$(dirname "$FIREBASE_FILE")"

          if [ -f "$GITHUB_WORKSPACE/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/google-services.json" "$FIREBASE_FILE"
          fi

          if [ ! -f "$FIREBASE_FILE" ]; then
            echo "ERROR: app/google-services.json is missing."
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Check Login/Signup and icon assets
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/src/main/assets/index.html" || {
            echo "ERROR: Login/Signup HTML file not found."
            exit 1
          }

          RES="$PROJECT_DIR/app/src/main/res"

          if ! find "$RES" -type f \
            \( -iname 'ic_launcher.png' -o -iname 'ic_launcher.xml' \) \
            | grep -q .; then
            echo "ERROR: Launcher icon resource not found."
            exit 1
          fi

          echo "Login page and icon resources found."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build VYBE debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
