name: Build VYBE APK

'on':
workflow_dispatch:
push:
paths:
- '*.zip'
- '.github/workflows/build-apk.yml'

permissions:
contents: read

jobs:
build:
name: Build VYBE Android App
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Extract Android project
    id: project
    shell: bash
    run: |
      set -euo pipefail

      ARCHIVE="VYBE_Login_Signup_Firebase_Configured.zip"

      if [ ! -f "$ARCHIVE" ]; then
        echo "ERROR: ZIP not found: $ARCHIVE"
        echo "ZIP files available:"
        find . -maxdepth 2 -type f -iname '*.zip'
        exit 1
      fi

      mkdir -p extracted
      unzip -oq "$ARCHIVE" -d extracted

      SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

      if [ -z "$SETTINGS_FILE" ]; then
        echo "ERROR: No settings.gradle found inside ZIP"
        exit 1
      fi

      PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

      if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
        echo "ERROR: No app/build.gradle found"
        exit 1
      fi

      echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

  - name: Verify Firebase configuration
    working-directory: ${{ steps.project.outputs.dir }}
    shell: bash
    run: |
      if [ -f app/google-services.json ]; then
        echo "Firebase configuration found"
      else
        echo "Firebase configuration missing from app folder"
      fi

  - name: Build debug APK
    working-directory: ${{ steps.project.outputs.dir }}
    shell: bash
    run: |
      set -euo pipefail

      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug
      else
        gradle --no-daemon assembleDebug
      fi

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: VYBE-Login-Signup-APK
      path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
