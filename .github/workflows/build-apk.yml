name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VYBE_Android_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -q VYBE_Android_Source.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd source/VYBE_Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vybe-debug-apk
          path: source/VYBE_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
