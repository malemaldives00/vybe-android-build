
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "VYBE_AUTH_PREMIUM_DESIGN_SOURCE_WITH_APP_ICON.zip"
      - "google-services.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract VYBE source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/VYBE_AUTH_PREMIUM_DESIGN_SOURCE_WITH_APP_ICON.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Source ZIP not found in repository root."
            exit 1
          fi

          SOURCE_DIR="$RUNNER_TEMP/vybe-source"
          mkdir -p "$SOURCE_DIR"
          unzip -q "$ARCHIVE" -d "$SOURCE_DIR"

          PROJECT_DIR="$SOURCE_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/java/com/vybe/app/MainActivity.java"
          test -f "$PROJECT_DIR/app/google-services.json"

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"

          test -f "$PROJECT_DIR/app/src/main/res/mipmap-mdpi/ic_launcher.png"
          test -f "$PROJECT_DIR/app/src/main/res/mipmap-mdpi/ic_launcher_round.png"

          # Preserve the ZIP's Firebase configuration unless the repository
          # provides an explicit replacement.
          if [ -f "$GITHUB_WORKSPACE/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/google-services.json" \
              "$PROJECT_DIR/app/google-services.json"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
