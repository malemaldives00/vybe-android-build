name: Build VYBE APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract VYBE project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="VYBE_Login_Signup_Firebase_Configured (1).zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: $ARCHIVE not found in repository root"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/vybe-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/vybe-source"

          SETTINGS="$(find "$RUNNER_TEMP/vybe-source" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: VYBE app HTML not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: Firebase configuration not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build VYBE APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
