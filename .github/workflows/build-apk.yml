
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "*.zip"
      - "vybe_logo.png"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/source"

          FOUND=""

          while IFS= read -r -d '' ZIP; do
            echo "Checking ZIP: $ZIP"

            if unzip -Z1 "$ZIP" |
              grep -Eq '(^|/)settings\.gradle(\.kts)?$' &&
              unzip -Z1 "$ZIP" |
              grep -Eq '(^|/)app/src/main/AndroidManifest\.xml$'; then
              FOUND="$ZIP"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -iname '*.zip' \
              -not -path '*/source/*' \
              -print0
          )

          if [ -z "$FOUND" ]; then
            echo "::error::No valid Android project ZIP found."
            echo "ZIP must contain settings.gradle and app/src/main/AndroidManifest.xml."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          echo "Found project ZIP: $FOUND"
          unzip -q "$FOUND" -d "$GITHUB_WORKSPACE/source"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project structure is incomplete."
            find "$GITHUB_WORKSPACE/source" -maxdepth 6 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -name '*debug*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            find "$PROJECT_DIR" -type f -name '*.apk'
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/output/VYBE-debug.apk"
          echo "APK collected successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-debug-APK
          path: output/VYBE-debug.apk
          if-no-files-found: error
          retention-days: 7
