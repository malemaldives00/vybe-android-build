
name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VYBE Android App
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract VYBE project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="VYBE_Login_Signup_Logo_Preserved.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Project ZIP not found: $ARCHIVE"
            echo "Check the ZIP filename in your repository."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/vybe-source"

          unzip -q "$ARCHIVE" \
            -d "$RUNNER_TEMP/vybe-source"

          PROJECT_DIR="$RUNNER_TEMP/vybe-source"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            PROJECT_DIR="$(find "$RUNNER_TEMP/vybe-source" \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Android project directory not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify app icon and login page
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f app/src/main/assets/index.html

          if ! grep -q "ic_launcher" \
            app/src/main/AndroidManifest.xml; then
            echo "WARNING: Check launcher icon configuration."
          fi

          echo "Project files verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Upload VYBE APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-Login-Signup-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
