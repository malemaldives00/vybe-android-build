name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "*.zip"
      - "google-services.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract latest VYBE source and preserve design
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="VYBE_CP_Friend_Click_Back_Repaired_with_MY_EXACT_Icon.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Source ZIP not found: $ARCHIVE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/vybe-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/vybe-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/vybe-source" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          APP_DIR="$PROJECT_DIR/app"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          RES="$APP_DIR/src/main/res"

          test -f "$MANIFEST"
          test -f "$APP_DIR/google-services.json"
          test -f "$RES/mipmap-mdpi/ic_launcher.png"
          test -f "$RES/mipmap-mdpi/ic_launcher_round.png"

          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"

          if [ -f "$GITHUB_WORKSPACE/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/google-services.json" \
              "$APP_DIR/google-services.json"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
